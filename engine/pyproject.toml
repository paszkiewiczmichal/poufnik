[project]
name = "anonymizer-engine"
version = "0.1.0"
description = "Offline document anonymization engine for Anonymizer."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116",
  "pdfplumber>=0.11",
  "pillow>=12",
  "presidio-analyzer>=2.2.360",
  "pydantic>=2.7",
  "pypdfium2>=4.30",
  "regex>=2024.11",
  "python-multipart>=0.0.20",
  "python-docx>=1.2",
  "pyyaml>=6.0",
  "reportlab>=4.2",
  "spacy>=3.8,<3.9",
  "uvicorn>=0.34",
  "pillow-heif>=1.4.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.6",
]
build = [
  "pyinstaller>=6.11",
]
models = [
  "pl-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/pl_core_news_lg-3.8.0/pl_core_news_lg-3.8.0-py3-none-any.whl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anonymizer_engine"]

[tool.hatch.build.targets.wheel.force-include]
"src/anonymizer_engine/anonymize/resources/DejaVuSans.ttf" = "anonymizer_engine/anonymize/resources/DejaVuSans.ttf"
"src/anonymizer_engine/detection/resources/names.db" = "anonymizer_engine/detection/resources/names.db"
"src/anonymizer_engine/detection/resources/places.db" = "anonymizer_engine/detection/resources/places.db"

[project.scripts]
anonymizer-engine = "anonymizer_engine.api.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "ocr: tests requiring a local Tesseract installation with OCR language data",
  "slow: performance and larger-input tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["anonymizer_engine"]
strict = false
warn_unused_configs = true
