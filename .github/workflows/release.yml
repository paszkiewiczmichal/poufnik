name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  release-metadata:
    name: release-metadata
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.changelog.outputs.body }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      mas: ${{ steps.mas.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag metadata
        id: tag
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # The Mac App Store job runs only once its certificate and provisioning profile exist
      # (a job's own `if` cannot read secrets).
      - name: Mac App Store secrets
        id: mas
        env:
          MAS_CERTIFICATE: ${{ secrets.MAS_CERTIFICATE }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        run: |
          if [ -n "$MAS_CERTIFICATE" ] && [ -n "$MAS_PROVISIONING_PROFILE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Mac App Store certificate or provisioning profile; skipping the App Store build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Generate changelog
        id: changelog
        run: |
          uv run --no-project --python "${PYTHON_VERSION}" python .github/scripts/generate_changelog.py --tag "${GITHUB_REF_NAME}" --output release-changelog.md
          {
            echo "body<<EOF"
            cat release-changelog.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  test-engine:
    name: test-engine (windows-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install Tesseract
        run: |
          $tessHome = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$tessHome\tesseract.exe")) {
            choco install tesseract --yes --no-progress
          }
          if (-not (Test-Path "$tessHome\tesseract.exe")) {
            throw "Tesseract not found at $tessHome and Chocolatey install did not provide it."
          }
          $tessData = "$tessHome\tessdata"
          foreach ($lang in @("pol", "eng")) {
            $target = Join-Path $tessData "$lang.traineddata"
            if (-not (Test-Path $target)) {
              Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile $target
            }
          }
          echo $tessHome | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install engine dependencies
        working-directory: engine
        run: uv sync --group dev --group models

      - name: Pytest
        working-directory: engine
        run: uv run pytest

  test-desktop:
    name: test-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Vitest
        working-directory: desktop
        run: npm run test

  build-windows-installer:
    name: build-windows-installer
    needs:
      - release-metadata
      - test-engine
      - test-desktop
    runs-on: windows-latest
    env:
      RELEASE_TARGET: x86_64-pc-windows-msvc
      CHECKSUM_NAME: SHA256SUMS-windows-x64.txt
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
      AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_ARTIFACT_SIGNING_AVAILABLE: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT != '' && secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT != '' && secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Prepare release version
        run: uv run --python ${{ env.PYTHON_VERSION }} --no-project python .github/scripts/prepare_release_version.py "${{ github.ref_name }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RELEASE_TARGET }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Set up .NET 8 for Azure Artifact Signing
        if: env.AZURE_ARTIFACT_SIGNING_AVAILABLE == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Tesseract
        run: |
          $tessHome = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$tessHome\tesseract.exe")) {
            choco install tesseract --yes --no-progress
          }
          if (-not (Test-Path "$tessHome\tesseract.exe")) {
            throw "Tesseract not found at $tessHome and Chocolatey install did not provide it."
          }
          $tessData = "$tessHome\tessdata"
          foreach ($lang in @("pol", "eng")) {
            $target = Join-Path $tessData "$lang.traineddata"
            if (-not (Test-Path $target)) {
              Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile $target
            }
          }
          echo $tessHome | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install engine dependencies
        working-directory: engine
        run: uv sync --group dev --group models --group build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Configure updater signing key
        run: uv run --python ${{ env.PYTHON_VERSION }} --no-project python .github/scripts/configure_updater_key.py

      - name: Warn about missing Azure Artifact Signing
        if: env.AZURE_ARTIFACT_SIGNING_AVAILABLE != 'true'
        run: echo "::warning::Azure Artifact Signing secrets are missing. Building an unsigned Windows NSIS installer so the workflow can complete."

      - name: Install Azure Artifact Signing CLI
        if: env.AZURE_ARTIFACT_SIGNING_AVAILABLE == 'true'
        run: cargo install artifact-signing-cli --locked

      - name: Configure Azure Artifact Signing
        if: env.AZURE_ARTIFACT_SIGNING_AVAILABLE == 'true'
        run: |
          uv run --python ${{ env.PYTHON_VERSION }} --no-project python .github/scripts/configure_azure_artifact_signing.py `
            --endpoint "$env:AZURE_ARTIFACT_SIGNING_ENDPOINT" `
            --account "$env:AZURE_ARTIFACT_SIGNING_ACCOUNT" `
            --profile "$env:AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE" `
            --description "Poufnik"

      - name: Build engine sidecar
        working-directory: engine
        run: uv run python build/build_sidecar.py --target-triple "$env:RELEASE_TARGET" --clean

      - name: Locate signtool.exe
        if: env.AZURE_ARTIFACT_SIGNING_AVAILABLE == 'true'
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe not found under Windows Kits on this runner."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $signtool.DirectoryName

      - name: Sign engine sidecar
        if: env.AZURE_ARTIFACT_SIGNING_AVAILABLE == 'true'
        run: |
          $sidecar = "desktop/src-tauri/binaries/anonymizer-engine-$env:RELEASE_TARGET.exe"
          if (-not (Test-Path $sidecar)) {
            throw "Sidecar executable not found: $sidecar"
          }
          artifact-signing-cli `
            -e "$env:AZURE_ARTIFACT_SIGNING_ENDPOINT" `
            -a "$env:AZURE_ARTIFACT_SIGNING_ACCOUNT" `
            -c "$env:AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE" `
            -d "Poufnik" `
            "$sidecar"
          signtool verify /pa "$sidecar"

      - name: Build Tauri installer
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Poufnik ${{ github.ref_name }}
          releaseBody: ${{ needs.release-metadata.outputs.body }}
          releaseDraft: true
          prerelease: ${{ needs.release-metadata.outputs.prerelease }}
          args: --target ${{ env.RELEASE_TARGET }} --bundles nsis
          retryAttempts: 2
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: "[name]_[version]_[platform]_[arch][setup][ext]"

      - name: Verify Windows signatures
        if: env.AZURE_ARTIFACT_SIGNING_AVAILABLE == 'true'
        run: |
          $paths = @()
          $paths += Get-Item "desktop/src-tauri/binaries/anonymizer-engine-$env:RELEASE_TARGET.exe"
          $paths += Get-ChildItem -Path "desktop/src-tauri/target/$env:RELEASE_TARGET/release/bundle/nsis" -File -Filter "*.exe" -ErrorAction SilentlyContinue
          $uniquePaths = $paths | Where-Object { $_ -and (Test-Path $_.FullName) } | Sort-Object FullName -Unique
          if (-not $uniquePaths) {
            throw "No Windows executables found for signature verification."
          }
          foreach ($path in $uniquePaths) {
            signtool verify /pa "$($path.FullName)"
          }

      - name: Generate SHA256 checksums
        run: uv run --python ${{ env.PYTHON_VERSION }} --no-project python .github/scripts/sha256_artifacts.py --output "$env:CHECKSUM_NAME"

      - name: Artifact size summary
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Artifact | Size |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| --- | ---: |"
          $installers = Get-ChildItem -Path "desktop/src-tauri/target/$env:RELEASE_TARGET/release/bundle/nsis" -File -Filter "*.exe" -ErrorAction SilentlyContinue
          if (-not $installers) {
            Write-Host "::warning::No NSIS installer artifacts were found for size reporting."
          }
          foreach ($path in $installers) {
            $sizeMb = $path.Length / 1MB
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("| {0} | {1:N1} MB |" -f $path.Name, $sizeMb)
            if ($sizeMb -gt 900) {
              Write-Host "::warning::$($path.Name) is larger than 900 MB; inspect PyInstaller _internal, spaCy model and bundled Tesseract resources before release."
            }
          }

      - name: Upload checksum workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums-windows-x64
          path: ${{ env.CHECKSUM_NAME }}

  publish-checksums:
    name: publish-checksums
    runs-on: ubuntu-latest
    needs:
      - build-windows-installer
      - build-macos-installer
    steps:
      # Taken from the digests GitHub computes for the files in the release, so the names are
      # the ones users download (the per-job files list local build names such as
      # Poufnik.app.tar.gz) and the macOS DMGs are counted after notarization replaced them.
      - name: Combine checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .assets[]
                  | select(.name != \"latest.json\" and .name != \"SHA256SUMS.txt\")
                  | \"\\(.digest | sub(\"sha256:\"; \"\"))  \\(.name)\"" \
            | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: Upload SHA256SUMS to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt --clobber --repo "${{ github.repository }}"

  build-windows-msix:
    name: build-windows-msix
    needs:
      - release-metadata
      - test-engine
      - test-desktop
    runs-on: windows-latest
    env:
      RELEASE_TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Prepare release version
        run: uv run --python ${{ env.PYTHON_VERSION }} --no-project python .github/scripts/prepare_release_version.py "${{ github.ref_name }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RELEASE_TARGET }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          shared-key: msix

      - name: Install Tesseract
        run: |
          $tessHome = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$tessHome\tesseract.exe")) {
            choco install tesseract --yes --no-progress
          }
          if (-not (Test-Path "$tessHome\tesseract.exe")) {
            throw "Tesseract not found at $tessHome and Chocolatey install did not provide it."
          }
          $tessData = "$tessHome\tessdata"
          foreach ($lang in @("pol", "eng")) {
            $target = Join-Path $tessData "$lang.traineddata"
            if (-not (Test-Path $target)) {
              Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile $target
            }
          }
          echo $tessHome | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install engine dependencies
        working-directory: engine
        run: uv sync --group dev --group models --group build

      - name: Build engine sidecar
        working-directory: engine
        run: uv run python build/build_sidecar.py --target-triple "$env:RELEASE_TARGET" --clean

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # tauri-windows-bundle copies only the main exe, assets and bundle.resources - it ignores
      # bundle.externalBin, so the engine sidecar would be missing from the MSIX and the app
      # could never start its engine.
      - name: Add engine sidecar to MSIX resources
        run: uv run --python ${{ env.PYTHON_VERSION }} --no-project python .github/scripts/add_msix_sidecar_resource.py --target-triple "${{ env.RELEASE_TARGET }}"

      # No signing here: Microsoft Store re-signs MSIX/MSIXbundle packages with its own
      # certificate after certification, so an unsigned build is the correct artifact to
      # hand to Partner Center. bundle.config.json's signing.pfx stays null in CI - local
      # sideload testing (which does need a trusted signature) uses a throwaway dev cert,
      # never committed, passed via --pfx/--pfx-password on the CLI.
      # The Store build must not ship the GitHub self-updater flow: the Store updates the app.
      - name: Build MSIX package
        working-directory: desktop
        env:
          VITE_POUFNIK_DISTRIBUTION: store
        run: npm run tauri:windows:build -- --runner npm --verbose

      - name: Verify the frontend was built for the Store channel
        shell: bash
        run: |
          # grep -l exits 1 when nothing matches, which -e/pipefail would turn into a script abort.
          store=$( (grep -l "poufnik-channel-store" desktop/dist/assets/*.js || true) | wc -l )
          direct=$( (grep -l "poufnik-channel-direct" desktop/dist/assets/*.js || true) | wc -l )
          if [ "$store" -lt 1 ] || [ "$direct" -gt 0 ]; then
            echo "Frontend bundle is not a Store-channel build (store=$store direct=$direct)."
            exit 1
          fi
          echo "Frontend bundle is a Store-channel build."

      - name: Verify MSIX contains the engine sidecar
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $msix = Get-ChildItem desktop/src-tauri/target/msix -Filter "*_x64.msix" | Select-Object -First 1
          if (-not $msix) { throw "No x64 .msix was produced." }
          $zip = [IO.Compression.ZipFile]::OpenRead($msix.FullName)
          try { $names = @($zip.Entries | ForEach-Object { $_.FullName }) } finally { $zip.Dispose() }
          foreach ($required in @("Poufnik.exe", "anonymizer-engine.exe")) {
            if ($names -notcontains $required) { throw "MSIX is missing $required - the app cannot start its engine." }
          }
          if (-not ($names | Where-Object { $_ -like "_internal/*" })) { throw "MSIX is missing the _internal runtime folder." }
          # Without resources.pri Windows ignores the targetsize/unplated variants and draws the
          # accent-colour plate behind the taskbar icon.
          if ($names -notcontains "resources.pri") { throw "MSIX is missing resources.pri (bundle.config.json resourceIndex.enabled)." }
          foreach ($icon in @("Assets/Square44x44Logo.targetsize-24_altform-unplated.png", "Assets/Square44x44Logo.targetsize-48_altform-unplated.png", "Assets/Square150x150Logo.png", "Assets/StoreLogo.png")) {
            if ($names -notcontains $icon) { throw "MSIX is missing tile asset $icon." }
          }
          Write-Host "MSIX layout OK: $($msix.Name) contains Poufnik.exe, anonymizer-engine.exe, _internal/ and tile assets."

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: poufnik-msix-${{ github.ref_name }}
          path: desktop/src-tauri/target/msix/*.msix*
          if-no-files-found: error

  build-macos-installer:
    name: build-macos-installer (${{ matrix.arch }})
    needs:
      - release-metadata
      - test-engine
      - test-desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            target: aarch64-apple-darwin
            asset_arch: aarch64
            # The oldest macOS every bundled binary loads on (Homebrew's Tesseract);
            # smoke_app_bundle.py fails the build when a binary needs more.
            minimum_macos: "14.8.5"
          # macos-13 was fully retired 2025-12-08 (GitHub deprecated the whole macOS 13
          # image); macos-15-intel is the current label for a hosted Intel runner, kept
          # available until August 2027 per GitHub's Apple-silicon migration plan.
          - os: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
            asset_arch: x64
            minimum_macos: "15.0"
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      CHECKSUM_NAME: SHA256SUMS-macos-${{ matrix.arch }}.txt
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Prepare release version
        run: uv run --python ${{ env.PYTHON_VERSION }} --no-project python .github/scripts/prepare_release_version.py "${{ github.ref_name }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RELEASE_TARGET }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          shared-key: macos-${{ matrix.arch }}

      # build_sidecar.py finds this via shutil.which("tesseract"), downloads any missing
      # pol/eng traineddata itself (Homebrew's formula only ships eng), and stages the
      # binary + dylibs (rpath-rewritten) into the bundled binaries/tesseract resource -
      # no separate tessdata step needed, unlike the Windows job.
      - name: Install Tesseract
        run: brew install tesseract

      # UV_LINK_MODE=copy: uv's default cache-linking (hardlinks/symlinks on macOS) leaves
      # site-packages data files that PyInstaller's --collect-data can't always see when
      # walking the tree, which is why the arm64/x86_64 build failed its post-build smoke
      # test with presidio_analyzer's conf/default_recognizers.yaml missing from the bundle.
      # Forcing real copies makes .venv identical to a normal (non-uv-cached) install.
      - name: Install engine dependencies
        working-directory: engine
        env:
          UV_LINK_MODE: copy
        run: uv sync --group dev --group models --group build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Configure updater signing key
        run: uv run --python ${{ env.PYTHON_VERSION }} --no-project python .github/scripts/configure_updater_key.py

      # Developer ID signing and notarization switch on by themselves once the Apple secrets
      # exist; without them the build stays ad-hoc signed, as before. The certificate goes
      # into a temporary keychain before the sidecar build, because build_sidecar.py signs
      # every engine and Tesseract binary itself (Tauri signs only the app's own executable).
      # Only APPLE_SIGNING_IDENTITY reaches Tauri, not APPLE_CERTIFICATE, so Tauri signs from
      # this keychain instead of importing the same certificate into a second one.
      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::No Apple certificate configured; building ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/poufnik-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
            {
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$key_path"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Apple certificate without an App Store Connect API key: signed, not notarized."
          fi

      - name: Build engine sidecar
        working-directory: engine
        run: uv run python build/build_sidecar.py --target-triple "$RELEASE_TARGET" --clean

      # Info.plist's LSMinimumSystemVersion for this architecture; Homebrew's bottles for
      # the Intel runner need a newer macOS than those for Apple Silicon.
      - name: Set minimum macOS
        env:
          MINIMUM_MACOS: ${{ matrix.minimum_macos }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path("desktop/src-tauri/tauri.macos.conf.json")
          config = json.loads(path.read_text())
          config["bundle"]["macOS"]["minimumSystemVersion"] = os.environ["MINIMUM_MACOS"]
          path.write_text(json.dumps(config, indent=2) + "\n")
          PY

      # With APPLE_SIGNING_IDENTITY set (previous step) Tauri signs the app with the hardened
      # runtime and Entitlements.plist, and with APPLE_API_* it also notarizes and staples
      # it. Without them it ad-hoc signs, which Apple Silicon needs to launch anything.
      - name: Build Tauri installer
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Poufnik ${{ github.ref_name }}
          releaseBody: ${{ needs.release-metadata.outputs.body }}
          releaseDraft: true
          prerelease: ${{ needs.release-metadata.outputs.prerelease }}
          # "app" is the bundle the updater installs: without it Tauri makes no .app.tar.gz,
          # and latest.json for 1.0.15 listed only Windows, so Macs never saw an update.
          args: --target ${{ env.RELEASE_TARGET }} --bundles app,dmg
          retryAttempts: 2
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: "[name]_[version]_[platform]_[arch][setup][ext]"

      # Mounts the finished DMG and runs the engine and OCR from the Poufnik.app inside it -
      # exactly what users download, which build_sidecar.py's own smoke tests can only
      # imitate. 1.0.15 shipped a macOS app whose engine could not start and whose Tesseract
      # could not load; this step catches both.
      - name: Smoke-test engine inside the DMG
        working-directory: engine
        run: |
          shopt -s nullglob
          dmgs=(../desktop/src-tauri/target/${RELEASE_TARGET}/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -ne 1 ]; then echo "::error::Expected exactly one DMG, found ${#dmgs[@]}"; exit 1; fi
          uv run python build/smoke_app_bundle.py "${dmgs[0]}"

      # The DMG itself is signed, notarized and stapled too, so Gatekeeper accepts the
      # download before the app inside is even looked at. Stapling changes the file, so the
      # copy tauri-action already attached to the draft release is replaced.
      - name: Notarize DMG
        if: env.APPLE_API_KEY_PATH != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          dmgs=(desktop/src-tauri/target/${RELEASE_TARGET}/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -ne 1 ]; then echo "::error::Expected exactly one DMG, found ${#dmgs[@]}"; exit 1; fi
          dmg="${dmgs[0]}"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --timeout 60m
          xcrun stapler staple "$dmg"
          asset=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' \
            | grep "_darwin_${{ matrix.asset_arch }}\.dmg$")
          cp "$dmg" "$RUNNER_TEMP/$asset"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$asset" --clobber

      - name: Verify signature and Gatekeeper
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          dmg=$(ls desktop/src-tauri/target/${RELEASE_TARGET}/release/bundle/dmg/*.dmg)
          mount_point=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point" > /dev/null
          app="$mount_point/Poufnik.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E "Authority|TeamIdentifier|Runtime|flags"
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            spctl --assess --type execute --verbose=4 "$app"
            # stapler asks Apple's servers and sometimes loses the connection (v1.0.18 Intel).
            for target in "$app" "$dmg"; do
              for attempt in 1 2 3 4 5; do
                xcrun stapler validate "$target" && break
                [ "$attempt" -eq 5 ] && exit 1
                sleep 20
              done
            done
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          fi
          hdiutil detach "$mount_point" -force > /dev/null

      - name: Generate SHA256 checksums
        run: uv run --python ${{ env.PYTHON_VERSION }} --no-project python .github/scripts/sha256_artifacts.py --output "$CHECKSUM_NAME"

      - name: Artifact size summary
        run: |
          {
            echo "| Artifact | Size |"
            echo "| --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          shopt -s nullglob
          for path in "desktop/src-tauri/target/${RELEASE_TARGET}/release/bundle/dmg"/*.dmg; do
            size_mb=$(du -m "$path" | cut -f1)
            echo "| $(basename "$path") | ${size_mb} MB |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload checksum workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums-macos-${{ matrix.arch }}
          path: ${{ env.CHECKSUM_NAME }}

  # Mac App Store: sandboxed build without the self-updater and without PDF through Word,
  # signed "Apple Distribution", packaged as a .pkg signed "Mac Installer Distribution" and
  # uploaded to App Store Connect. Uploading only adds a build there; submitting
  # it for review stays a manual step. Apple Silicon only: the PyInstaller engine is not a universal binary,
  # and the App Store accepts one build per version (Intel Macs keep the DMG).
  build-macos-mas:
    name: build-macos-mas
    needs:
      - release-metadata
      - test-engine
      - test-desktop
    if: needs.release-metadata.outputs.mas == 'true'
    runs-on: macos-14
    env:
      RELEASE_TARGET: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Prepare release version
        run: uv run --python ${{ env.PYTHON_VERSION }} --no-project python .github/scripts/prepare_release_version.py "${{ github.ref_name }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RELEASE_TARGET }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          shared-key: macos-mas

      - name: Install Tesseract
        run: brew install tesseract

      - name: Install engine dependencies
        working-directory: engine
        env:
          UV_LINK_MODE: copy
        run: uv sync --group dev --group models --group build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # One .p12 holds both identities ("Apple Distribution" for the app, "3rd Party Mac
      # Developer Installer" for the .pkg); their names are read from the keychain.
      - name: Import App Store certificates and profile
        env:
          MAS_CERTIFICATE: ${{ secrets.MAS_CERTIFICATE }}
          MAS_CERTIFICATE_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          keychain="$RUNNER_TEMP/poufnik-mas.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$MAS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/mas.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/mas.p12" -k "$keychain" -P "$MAS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          rm "$RUNNER_TEMP/mas.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Apple Distribution certificates chain to the WWDR G3 intermediate, which the
          # runner image does not necessarily carry; codesign needs it to build the chain.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$keychain" > /dev/null || true
          identities="$(security find-identity "$keychain")"
          app_identity="$(printf '%s\n' "$identities" | sed -n 's/.*"\(Apple Distribution: .*\)".*/\1/p' | head -1)"
          installer_identity="$(printf '%s\n' "$identities" \
            | sed -En 's/.*"((3rd Party Mac Developer Installer|Mac Installer Distribution): .*)".*/\1/p' | head -1)"
          if [ -z "$app_identity" ] || [ -z "$installer_identity" ]; then
            echo "::error::MAS_CERTIFICATE must hold both Apple Distribution and Mac Installer Distribution identities."
            exit 1
          fi
          echo "Signing: $app_identity / $installer_identity"
          printf '%s' "$MAS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/poufnik.provisionprofile"
          keys_dir="$RUNNER_TEMP/private_keys"
          mkdir -p "$keys_dir"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$keys_dir/AuthKey_${APPLE_API_KEY}.p8"
          {
            echo "MAS_APP_IDENTITY=$app_identity"
            echo "MAS_INSTALLER_IDENTITY=$installer_identity"
            echo "API_PRIVATE_KEYS_DIR=$keys_dir"
          } >> "$GITHUB_ENV"

      # Unsigned for distribution here (ad-hoc, smoke-tested); package_mas.py signs every
      # engine and Tesseract binary for the sandbox afterwards.
      - name: Build engine sidecar
        working-directory: engine
        run: uv run python build/build_sidecar.py --target-triple "$RELEASE_TARGET" --clean

      - name: Build Tauri app (Mac App Store)
        working-directory: desktop
        env:
          VITE_POUFNIK_DISTRIBUTION: mas
        run: |
          npx tauri build --target "$RELEASE_TARGET" --features mas \
            --config src-tauri/tauri.mas.conf.json --bundles app --no-sign

      - name: Verify the frontend was built for the Mac App Store channel
        run: |
          mas=$( (grep -l "poufnik-channel-mas" desktop/dist/assets/*.js || true) | wc -l )
          if [ "$mas" -lt 1 ]; then
            echo "Frontend bundle is not a Mac App Store build."
            exit 1
          fi
          echo "Frontend bundle is a Mac App Store build."

      - name: Smoke-test engine inside the app
        working-directory: engine
        run: uv run python build/smoke_app_bundle.py "../desktop/src-tauri/target/${RELEASE_TARGET}/release/bundle/macos/Poufnik.app"

      - name: Sign and package for the App Store
        run: |
          python3 desktop/scripts/package_mas.py \
            --app "desktop/src-tauri/target/${RELEASE_TARGET}/release/bundle/macos/Poufnik.app" \
            --out-dir "$RUNNER_TEMP/mas" \
            --app-identity "$MAS_APP_IDENTITY" \
            --installer-identity "$MAS_INSTALLER_IDENTITY" \
            --provisioning-profile "$RUNNER_TEMP/poufnik.provisionprofile"
          echo "MAS_PKG=$(ls "$RUNNER_TEMP"/mas/*.pkg)" >> "$GITHUB_ENV"

      - name: Upload .pkg workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: poufnik-mas-${{ github.ref_name }}
          path: ${{ env.MAS_PKG }}
          if-no-files-found: error

      # Pre-releases (tags with "-") stop here; a release build goes to App Store Connect,
      # where it waits until it is attached to a version and submitted for review by hand.
      - name: Validate and upload to App Store Connect
        if: needs.release-metadata.outputs.prerelease != 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun altool --validate-app -f "$MAS_PKG" -t macos --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
          xcrun altool --upload-app -f "$MAS_PKG" -t macos --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
