name: Notarize macOS DMG

# Finishes a DMG already attached to a release: staples the app inside it, then signs,
# notarizes and staples the DMG itself and replaces the file in the release. Release runs it
# for the Intel DMG, whose runner (macos-15-intel) cannot reach Apple's ticket service
# reliably; stapling is architecture-independent, so it runs on Apple Silicon. It can also be
# started by hand for a release whose DMG was left unnotarized.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v1.0.21
        required: true
        type: string
      asset_arch:
        description: Architecture in the DMG's asset name (Poufnik_<version>_darwin_<arch>.dmg)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.0.21
        required: true
        type: string
      asset_arch:
        description: Architecture in the DMG's asset name (Poufnik_<version>_darwin_<arch>.dmg)
        required: true
        default: x64
        type: choice
        options:
          - x64
          - aarch64

permissions:
  contents: write

jobs:
  notarize-dmg:
    name: notarize-dmg (${{ inputs.asset_arch }})
    runs-on: macos-14
    env:
      TAG: ${{ inputs.tag }}
      ASSET_ARCH: ${{ inputs.asset_arch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_API_PRIVATE_KEY" ]; then
            echo "::error::Notarizing needs the Apple certificate and the App Store Connect API key."
            exit 1
          fi
          keychain="$RUNNER_TEMP/poufnik-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_KEY_PATH=$key_path"
          } >> "$GITHUB_ENV"

      - name: Download DMG from the release
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" --pattern "*_darwin_${ASSET_ARCH}.dmg" --dir "$RUNNER_TEMP/release"
          shopt -s nullglob
          dmgs=("$RUNNER_TEMP/release"/*.dmg)
          if [ ${#dmgs[@]} -ne 1 ]; then echo "::error::Expected exactly one DMG, found ${#dmgs[@]}"; exit 1; fi
          echo "DMG=${dmgs[0]}" >> "$GITHUB_ENV"

      # Through a shadow file, because the image itself is read-only; the result is written
      # back as a compressed UDZO image.
      - name: Staple app inside the DMG
        run: |
          shadow="$RUNNER_TEMP/dmg.shadow"
          mount_point=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -shadow "$shadow" -mountpoint "$mount_point" > /dev/null
          app="$mount_point/Poufnik.app"
          for attempt in 1 2 3 4 5 6; do
            xcrun stapler staple "$app" && xcrun stapler validate "$app" && break
            if [ "$attempt" -eq 6 ]; then hdiutil detach "$mount_point" -force > /dev/null; exit 1; fi
            sleep 30
          done
          hdiutil detach "$mount_point" > /dev/null
          hdiutil convert "$DMG" -shadow "$shadow" -format UDZO -o "$RUNNER_TEMP/stapled.dmg" > /dev/null
          mv -f "$RUNNER_TEMP/stapled.dmg" "$DMG"
          rm -f "$shadow"

      - name: Sign and notarize DMG
        run: |
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --timeout 60m
          for attempt in 1 2 3 4 5 6; do
            xcrun stapler staple "$DMG" && break
            [ "$attempt" -eq 6 ] && exit 1
            sleep 30
          done

      - name: Verify signature and Gatekeeper
        run: |
          mount_point=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$mount_point" > /dev/null
          app="$mount_point/Poufnik.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E "Authority|TeamIdentifier|Runtime|flags"
          spctl --assess --type execute --verbose=4 "$app"
          codesign --verify --strict --verbose=2 "$DMG"
          for target in "$app" "$DMG"; do
            for attempt in 1 2 3 4 5; do
              xcrun stapler validate "$target" && break
              [ "$attempt" -eq 5 ] && exit 1
              sleep 20
            done
          done
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          hdiutil detach "$mount_point" -force > /dev/null

      - name: Replace DMG in the release
        run: gh release upload "$TAG" "$DMG" --clobber

      # In a release run publish-checksums does this after this job; started by hand, the
      # replaced DMG would otherwise keep the old checksum.
      - name: Update SHA256SUMS in the release
        if: github.event_name == 'workflow_dispatch'
        run: |
          gh api "repos/${GH_REPO}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .assets[]
                  | select(.name != \"latest.json\" and .name != \"SHA256SUMS.txt\")
                  | \"\\(.digest | sub(\"sha256:\"; \"\"))  \\(.name)\"" \
            | sort -k2 > "$RUNNER_TEMP/SHA256SUMS.txt"
          cat "$RUNNER_TEMP/SHA256SUMS.txt"
          test -s "$RUNNER_TEMP/SHA256SUMS.txt"
          gh release upload "$TAG" "$RUNNER_TEMP/SHA256SUMS.txt" --clobber
