name: Store submission (one-off)

# Temporary, on its own branch: puts the 1.3.0 package and the new Polish listing into the
# pending Microsoft Store submission (MODE=prepare) and sends it to certification
# (MODE=commit). Approved by the owner in chat on 2026-11-19.
on:
  push:
    branches:
      - sklep-zgloszenie-1.3.0

permissions:
  contents: read
  actions: read

jobs:
  store-submission:
    runs-on: ubuntu-latest
    env:
      MODE: commit
      TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
      CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the 1.3.0 MSIX
        if: env.MODE == 'prepare'
        uses: actions/download-artifact@v4
        with:
          name: poufnik-msix-v1.3.0
          path: store-package
          run-id: 44414173071
          github-token: ${{ github.token }}

      - run: python3 .github/scripts/store_submission.py
