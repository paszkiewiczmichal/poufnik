[package]
name = "poufnik-shell-menu"
version = "0.1.0"
edition = "2021"
description = "Windows 11 Explorer context menu for Poufnik (IExplorerCommand, Store package and GitHub installer)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }
windows-core = "0.62"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
